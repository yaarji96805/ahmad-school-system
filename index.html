<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHMAD DIGITAL SCHOOL - Result Portal</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--primary:#38bdf8;--text:#f8fafc}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{max-width:450px;width:100%}
.logo{text-align:center;margin-bottom:30px}
.logo-icon{width:90px;height:90px;background:var(--primary);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 15px;font-size:40px}
h1{font-size:28px} h1 span{color:var(--primary)}
.sub{opacity:.7;margin-top:5px}
.card{background:var(--card);padding:25px;border-radius:16px;margin-top:20px}
.btn{width:100%;padding:15px;background:#334155;border:1px solid #475569;color:white;border-radius:12px;margin-bottom:12px;font-size:18px;cursor:pointer;text-align:left}
.btn:hover{border-color:var(--primary);background:#1e293b}
.btn.primary{background:var(--primary);color:#000;font-weight:bold;text-align:center}
input{width:100%;padding:12px;border-radius:8px;border:none;margin:8px 0;background:#0f172a;color:white;border:1px solid #334155}
.hidden{display:none}
table{width:100%;border-collapse:collapse;margin-top:10px}
td,th{border:1px solid #334155;padding:8px;text-align:center}
.footer{text-align:center;margin-top:20px;opacity:.5;font-size:13px}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-icon">📚</div>
    <h1>AHMAD <span>DIGITAL SCHOOL</span></h1>
    <div class="sub">Developed by AHMAD | Weekly Mark Sheet Portal - Class 9th & 10th</div>
  </div>

  <div id="home">
    <button class="btn" onclick="show('adminLogin')">🔐 Admin Login - AHMAD</button>
    <button class="btn" onclick="show('teacherLogin')">
